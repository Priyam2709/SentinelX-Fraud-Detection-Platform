services:
  mongodb:
    image: mongo:7.0
    container_name: sentinelx-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sentinelx_fraud_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sentinelx-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=sentinelx_fraud_db
      - JWT_SECRET_KEY=sentinelx-super-secret-key-change-in-prod-2026
      - ACTIVE_MODEL_VERSION=xgb_v1.0
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sentinelx-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
